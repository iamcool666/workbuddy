name: WorkBuddy Daily Sign

on:
  schedule:
    - cron: '17 2 * * *'   # 北京时间每天上午 10:17 运行
    - cron: '45 7 * * *'   # 北京时间每天下午 3:45 运行
    - cron: '21 13 * * *'  # 北京时间每天晚上 9:21 运行
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pynacl

      - name: Run Checkin
        env:
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_TOKEN_JSON: ${{ secrets.WORKBUDDY_TOKEN_JSON }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # 用于刷新 token 后回写 Secret（可选，见 README）
        run: |
          python script/workbuddy/main.py
